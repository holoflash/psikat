<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>psikat-js</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <img src="/icon.png" height="50px" />
      <!-- These are just here for debugging -->
      <h1 id="playing-state">STOPPED</h1>
      <h1>|</h1>
      <h1 id="arranger-state">PATTERN EDITOR</h1>
      <h1>|</h1>
      <h1 id="semitone-state">SEMITONE 0</h1>
      <h1>|</h1>
      <h1 id="octave-state">OCTAVE 0</h1>
    </header>
    <main>
      <div class="arrangement">
        <!-- static -->
        <div class="arrangement-beat-col">
          <div id="arrangement-beat-cell"><br /></div>
          <div id="arrangement-beat-cell">01</div>
          <div id="arrangement-beat-cell">02</div>
          <div id="arrangement-beat-cell">03</div>
          <div id="arrangement-beat-cell">04</div>
          <div id="arrangement-beat-cell">05</div>
          <div id="arrangement-beat-cell">06</div>
          <div id="arrangement-beat-cell">07</div>
          <div id="arrangement-beat-cell">08</div>
        </div>
        <!-- dynamic -->
        <div id="pattern">
          <div id="pattern-header">
            <div id="pattern-note-header-cell">1</div>
            <div id="pattern-note-header-cell">2</div>
            <div id="pattern-fx-header-cell">FX</div>
          </div>
          <!-- dynamic -->
          <!-- Can access attributes like this later:
        HTMLElement.dataset.voices -->
          <div id="pattern-body" data-voices="2" data-automation="1" data-steps="8">
            <div id="pattern-note-col">
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
              <div id="pattern-note-cell">C-4</div>
            </div>
            <div id="pattern-note-col">
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
              <div id="pattern-note-cell">D-4</div>
            </div>
            <div id="pattern-fx-col">
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
              <div id="pattern-fx-cell">···</div>
            </div>
          </div>
        </div>
      </div>
      <!-- side panel -->
      <section id="instrument-panel">
        <header>INSTRUMENT</header>
        <button id="worklet-init">ENABLE AUDIO</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
