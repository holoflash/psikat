<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="/src/styles.css" />

  <body>
    <header>
      <img src="/icon.png" height="80px" />

    <main>

          <thead>
            <tr>
              <th scope="col">BEAT</th>
              <th scope="col">NOTE</th>

        </table>
        <!-- ---------------------- -->
      </section>
      <section id="instrument_panel">
        <header>INSTRUMENT</header>
        <label for="volume">VOLUME</label>
        <input title="volume" type="range" />

    </main>
    <footer>psikat 2026</footer>
    <!-- No JavaScript needed yet -->
    <script type="module" src="/src/main.ts"></script>
