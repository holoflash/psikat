<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>psikat-js</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <img src="/icon.png" height="50px" />
      <!-- These are just here for debugging -->
      <h1 id="playing-state">STOPPED</h1>
      <h1>|</h1>
      <h1 id="arranger-state">PATTERN EDITOR</h1>
      <h1>|</h1>
      <h1 id="semitone-state">SEMITONE 0</h1>
      <h1>|</h1>
      <h1 id="octave-state">OCTAVE 0</h1>
    </header>
    <main>
      <section id="main-grid">
        <!-- Can access attributes like this later:
        HTMLElement.dataset.voices -->
        <div class="pattern-body" data-voices="2" data-automation="1" data-steps="8">
          <div class="pattern-beat-col">
            <div class="pattern-header"><br /></div>
            <div class="pattern-cell">01</div>
            <div class="pattern-cell">02</div>
            <div class="pattern-cell">03</div>
            <div class="pattern-cell">04</div>
            <div class="pattern-cell">05</div>
            <div class="pattern-cell">06</div>
            <div class="pattern-cell">07</div>
            <div class="pattern-cell">08</div>
          </div>
          <div class="pattern-col">
            <div class="pattern-header">1</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
            <div class="pattern-cell">C-4</div>
          </div>
          <div class="pattern-col">
            <div class="pattern-header">2</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
            <div class="pattern-cell">D-4</div>
          </div>
          <div class="pattern-col">
            <div class="pattern-header">FX</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
            <div class="pattern-cell">···</div>
          </div>
        </div>
        <!-- Tables of patterns go here -->
      </section>
      <section id="instrument-panel">
        <header>INSTRUMENT</header>
        <button id="worklet-init">ENABLE AUDIO</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
