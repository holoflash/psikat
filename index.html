<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>psikat-js</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <img src="/icon.png" height="50px" />
      <!-- These are just here for debugging -->
      <h1 id="playing-state">STOPPED</h1>
      <h1>|</h1>
      <h1 id="arranger-state">PATTERN EDITOR</h1>
      <h1>|</h1>
      <h1 id="octave-state">OCTAVE 0</h1>
    </header>
    <main>
      <section id="main-grid">
        <!-- This is just a placeholder for now, gonna render the grid on a canvas later -->
        <table>
          <thead>
            <tr>
              <th scope="col"></th>
              <th scope="col" colspan="4">Pattern 1</th>
              <th scope="col">FX</th>
            </tr>
          </thead>
          <tbody id="mock-grid"></tbody>
        </table>
        <!-- ---------------------- -->
      </section>
      <section id="instrument_panel">
        <header>INSTRUMENT</header>
        <label for="volume">VOLUME</label>
        <input title="volume" type="range" />
        <button id="worklet-init">ENABLE AUDIO</button>
      </section>
    </main>
    <footer>psikat 2026</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
